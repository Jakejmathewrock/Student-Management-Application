<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;font-family:'Inter',sans-serif;}
  body{background:#060d1a;display:flex;min-height:100vh;}
  .left{flex:1;background:linear-gradient(145deg,#050b16,#0d1e35);border-right:1px solid rgba(59,130,246,0.12);display:flex;flex-direction:column;justify-content:center;padding:48px 44px;}
  .right{width:420px;flex-shrink:0;background:#080f1e;display:flex;align-items:center;justify-content:center;padding:44px 36px;}
  .form-title{font-size:22px;font-weight:800;color:#e8f0ff;margin-bottom:6px;}
  .form-sub{font-size:13px;color:#4a6fa5;margin-bottom:24px;}
  .error-box{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:8px;padding:10px 14px;font-size:12.5px;color:#f87171;margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;font-weight:600;color:#4a6fa5;margin-bottom:5px;text-transform:uppercase;}
  .input-wrap{position:relative;}
  .input-wrap .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;}
  .input-wrap input{width:100%;padding:10px 12px 10px 38px;background:#0c1628;border:1px solid #1a2a42;border-radius:8px;color:#e8f0ff;font-size:13px;font-family:inherit;outline:none;}
  .input-wrap input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.15);}
  .submit-btn{width:100%;padding:11px;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px;}
  .back-link{display:block;text-align:center;margin-top:16px;font-size:12.5px;color:#4a6fa5;text-decoration:none;}
  .back-link:hover{color:#3b82f6;}
  .demo-box{margin-top:16px;padding:11px 14px;background:rgba(59,130,246,0.06);border:1px solid rgba(59,130,246,0.15);border-radius:8px;font-size:11.5px;color:#4a6fa5;text-align:center;}
  .demo-box code{background:rgba(59,130,246,0.15);color:#3b82f6;padding:2px 6px;border-radius:4px;}
  @media(max-width:768px){body{flex-direction:column;}.left{display:none;}.right{width:100%;}}
</style>
