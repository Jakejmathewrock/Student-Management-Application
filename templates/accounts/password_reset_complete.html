{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Reset Complete — Sunny Leone Scholarship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="{% static 'css/auth.css' %}" rel="stylesheet"/>
  <style>
    .auth-card-single { max-width: 500px; margin: 0 auto; padding: 3rem; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
  </style>
</head>
<body class="auth-body">
<div class="auth-bg"><div class="auth-particles"></div></div>
<div class="auth-container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="auth-card-single w-100 text-center">
    <i class="fas fa-check-circle fa-4x text-success mb-4"></i>
    <h3 class="text-white">Password Reset Complete</h3>
    <p class="text-muted mt-3">Your password has been set. You may go ahead and log in now.</p>
    <div class="mt-4">
      <a href="{% url 'login' %}" class="btn-auth d-inline-block text-decoration-none px-5">Log In</a>
    </div>
  </div>
</div>
</body>
</html>
