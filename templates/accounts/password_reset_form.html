{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Sunny Leone Scholarship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="{% static 'css/auth.css' %}" rel="stylesheet"/>
  <style>
    .auth-card-single { max-width: 500px; margin: 0 auto; padding: 3rem; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    .form-control { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 12px 15px; border-radius: 10px; margin-bottom: 20px; width: 100%; }
    .form-control:focus { background: rgba(15, 23, 42, 0.8); border-color: #6366f1; color: #fff; box-shadow: none; }
  </style>
</head>
<body class="auth-body">
<div class="auth-bg"><div class="auth-particles"></div></div>
<div class="auth-container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="auth-card-single w-100">
    <div class="text-center mb-4">
      <i class="fas fa-key fa-3x text-primary mb-3"></i>
      <h3 class="text-white">Forgot Password?</h3>
      <p class="text-muted">Enter your email address and we'll send you a link to reset your password.</p>
    </div>
    <form method="POST">
      {% csrf_token %}
      <div class="mb-4">
        {{ form.email }}
      </div>
      <button type="submit" class="btn-auth w-100">
        <i class="fas fa-paper-plane me-2"></i>Send Reset Link
      </button>
    </form>
    <div class="text-center mt-4">
      <a href="{% url 'login' %}" class="text-decoration-none" style="color: #94a3b8;"><i class="fas fa-arrow-left me-2"></i>Back to Login</a>
    </div>
  </div>
</div>
</body>
</html>
