<!DOCTYPE html>
<html>

<head>

    <title>Student Management System</title>

    <style>

        body{
            background:#f4f4f4;
            font-family:Arial;
            padding:20px;
        }

        h1{
            text-align:center;
            color:darkblue;
        }

        .card{
            background:white;
            width:300px;
            padding:20px;
            margin:20px auto;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
            text-align:center;
        }

        img{
            width:120px;
            height:120px;
            border-radius:50%;
            object-fit:cover;
        }

    </style>

</head>

<body>

<h1>Student Management System</h1>

{% for student in students %}

<div class="card">

    {% if student.photo %}
        <img src="{{ student.photo.url }}">
    {% endif %}

    <h2>{{ student.name }}</h2>

    <p><b>Roll Number:</b> {{ student.roll_number }}</p>

    <p><b>Department:</b> {{ student.department }}</p>

    <p><b>Course:</b> {{ student.course }}</p>

    <p><b>Age:</b> {{ student.age }}</p>

</div>

{% endfor %}

</body>
</html>
