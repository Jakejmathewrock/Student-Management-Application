services:
  - type: web
    name: student-campus-portal
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --config gunicorn.conf.py"
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: campus-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

databases:
  - name: campus-db
    plan: free
